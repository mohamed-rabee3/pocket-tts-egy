# Egyptian 6-layer student (runs/egy/distill_6l): english_2026-09 architecture + Egyptian tokenizer.
weights_path: hf://kyutai/pocket-tts/languages/english_2026-09/model.safetensors@983151f13aaeab1b13c1e5e3c2c383d49a9edf3f
weights_path_without_voice_cloning: hf://kyutai/pocket-tts-without-voice-cloning/languages/english_2026-09/model.safetensors@e7205b6ee50e654a5ea19f0e9df2b0813b05e921

default_temperature: 0.3
# Every input goes through the training text's normalization (marks kept, final sukun
# dropped, Arabic punctuation); plain, partial and full diacritics are all supported.
text_normalizer: egyptian
# Marks written as the training text writes each word (build_manifest.py marks): another
# transcriber's vowel or marks on a word the training text never marked reach the model as
# token sequences it rarely saw (pocket_tts/egyptian_text.canonicalize_marks).
mark_lexicon: /data/egy/v2/mark_lexicon.json.gz
# Training text never capitalizes a leading Latin word.
capitalize_first_letter: false
# Egyptian speech carries fewer tokens per second than English: a lower rate gives slow
# speech room to reach its EOS (set from the v2 data, egyptian/README.md).
min_tokens_per_second: 1.5
flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 8000
    tokenizer: tokenizers
    tokenizer_path: /data/egy/v2/tokenizer.json
mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
